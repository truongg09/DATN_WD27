<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect width="96" height="96" rx="18" fill="#ffffff"/>
  <!-- Bieu tuong QR: 3 o dinh vi navy + module + diem nhan do -->
  <g>
    <!-- finder top-left -->
    <rect x="26" y="8" width="15" height="15" rx="3.5" fill="#0B2E63"/>
    <rect x="29.5" y="11.5" width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="31.5" y="13.5" width="4" height="4" fill="#0B2E63"/>
    <!-- finder top-right -->
    <rect x="55" y="8" width="15" height="15" rx="3.5" fill="#0B2E63"/>
    <rect x="58.5" y="11.5" width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="60.5" y="13.5" width="4" height="4" fill="#0B2E63"/>
    <!-- finder bottom-left -->
    <rect x="26" y="37" width="15" height="15" rx="3.5" fill="#0B2E63"/>
    <rect x="29.5" y="40.5" width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="31.5" y="42.5" width="4" height="4" fill="#0B2E63"/>
    <!-- modules -->
    <rect x="45" y="12" width="6" height="6" fill="#0B2E63"/>
    <rect x="45" y="26" width="6" height="6" fill="#0B2E63"/>
    <rect x="55" y="27" width="5" height="5" fill="#0B2E63"/>
    <rect x="64" y="27" width="6" height="6" fill="#0B2E63"/>
    <rect x="45" y="40" width="6" height="6" fill="#0B2E63"/>
    <rect x="54" y="37" width="5" height="5" fill="#0B2E63"/>
    <!-- diem nhan do kieu NAPAS -->
    <rect x="60" y="42" width="10" height="10" rx="2.5" fill="#ED1C24"/>
  </g>
  <!-- Wordmark VietQR -->
  <text x="48" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21"><tspan fill="#0B2E63">Viet</tspan><tspan fill="#ED1C24">QR</tspan></text>
</svg>
